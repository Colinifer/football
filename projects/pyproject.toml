# file: pyproject.toml
[project]
name = "football"
version = "0.1.0"
dependencies = [
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.13" # note: please prefer the latest version of Python
 # stricter mypy config
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
enable_error_code = [
  "ignore-without-code", # warn when `type: ignore` doesn't specify an error code
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "S", "SIM", "UP", "FAST"]
ignore = ["E501", "S311", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "D103", "D104"]

[tool.ruff.lint.pylint]
max-statements = 20
max-returns = 3
max-args = 7
max-nested-blocks = 3

[tool.uv.workspace]
members = [
    "airflow",
    "fantasy_recap",
]
