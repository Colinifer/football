# file: pyproject.toml

[project]
name = "football"
version = "0.1.0"
dependencies = [
    "altair>=6.0.0",
    "marimo",
    # add other deps here
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "polars>=1.37.1",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.5.0",
    "python-dotenv>=1.2.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "scipy>=1.11.0",
]

[tool.mypy]
python_version = "3.13" # note: please prefer the latest version of Python
 # stricter mypy config
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
enable_error_code = [
  "ignore-without-code", # warn when `type: ignore` doesn't specify an error code
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "S", "SIM", "UP", "FAST"]
ignore = ["E501", "S311", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "D103", "D104"]

[tool.ruff.lint.pylint]
max-statements = 20
max-returns = 3
max-args = 7
max-nested-blocks = 3

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]
