# file: pyproject.toml

[project]
name = "football"
version = "0.1.0"
dependencies = [
    "altair>=6.0.0",
    "marimo",
    # add other deps here
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "polars>=1.37.1",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.1",
    "seaborn>=0.13.2",
]

[tool.mypy]
python_version = "3.13" # note: please prefer the latest version of Python
 # stricter mypy config
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
enable_error_code = [
  "ignore-without-code", # warn when `type: ignore` doesn't specify an error code
]

[tool.ruff]
target-version = "py313" #: note: please prefer the latest version of Python
line-length = 79

[tool.ruff.lint]
select = ["ALL"]
# Conflicting rules generate a warning, disable them by default
ignore = ["D203", "D213"] # Consider ignoring specific rules on a per-project basis

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-quotes]
# Enforces docstring quotes (Q-rules). PEP 257 recommends triple double-quotes.
docstring-quotes = "double"

[tool.ruff.pylint]
max-statements = 20
max-returns = 3
max-args = 7
max-nested-blocks = 3

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
