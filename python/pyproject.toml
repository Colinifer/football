# file: pyproject.toml
[project]
name = "football"
version = "0.1.0"
dependencies = [
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.11" # note: please prefer the latest version of Python
 # stricter mypy config
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
enable_error_code = [
  "ignore-without-code", # warn when `type: ignore` doesn't specify an error code
]

[tool.ruff]
target-version = "py311" #: note: please prefer the latest version of Python
line-length = 79

[tool.ruff.lint]
select = ["ALL"]
# Conflicting rules generate a warning, disable them by default
ignore = ["D203", "D213"] # Consider ignoring specific rules on a per-project basis

[tool.ruff.pylint]
max-statements = 20
max-returns = 3
max-args = 7
max-nested-blocks = 3